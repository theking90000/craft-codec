[package]
name = "craft-codec"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
authors = ["theking90000 <martin.cogh@gmail.com>"]
description = "Cryptographic Random-Access Framing Toolkit"
license = "MIT"
repository = "https://github.com/theking90000/craft-codec"
documentation = "https://docs.rs/craft-codec"
readme = "README.md"
keywords = ["framing", "io", "cryptography", "compression", "random-access"]
categories = ["cryptography", "compression", "encoding"]
include = [
    "/src",
    "/tests",
    "/benches",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/Cargo.toml",
]

[features]
default = ["aes-gcm"]
aes-gcm = ["dep:aes-gcm"]
lz4 = ["dep:lz4_flex"]
serde = ["dep:serde"]

[dependencies]
aes-gcm = { version = "0.11.1", optional = true, default-features = false, features = ["aes", "zeroize"] }
lz4_flex = { version = "0.14.0", optional = true, default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
serde = { version = "1.0", optional = true, features = ["derive"] }

[dev-dependencies]
stats_alloc = "0.1.10"

[[test]]
name = "allocations"
harness = false

[[bench]]
name = "frames"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
