[package]
name = "craft-io"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["theking90000 <martin.cogh@gmail.com>"]
description = "Cryptographic Random-Access Framing Toolkit"
license = "MIT"
repository = "https://github.com/theking90000/craft-io"
documentation = "https://docs.rs/craft-io"
readme = "README.md"
keywords = ["async", "stream", "framing", "io", "cryptography"]
categories = ["asynchronous", "concurrency"]
include = [
    "/src",
    "/tests",
    "/benches",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/Cargo.toml",
]

[dependencies]
futures-core = "0.3.32"
pin-project-lite = "0.2.17"

[dev-dependencies]
stats_alloc = "0.1.10"
futures = "0.3.32"

#[[bench]]
#name = "scheduler"
#harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"